server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: /api/* -> backend:8000/* (the dashboard calls the API on the same origin).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-Sent Events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 256k;
    }

    # FastAPI's Swagger UI (/api/docs) loads its schema from this absolute path.
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    # Single-page app routing.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces (not extends) the server-level headers below.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
