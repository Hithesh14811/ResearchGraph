name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Ruff (lint)
        run: ruff check backend scripts evaluation
      - name: Ruff (format)
        run: ruff format --check backend scripts evaluation
      - name: Mypy
        run: mypy
      - name: Tests (offline, mocked LLM & search)
        run: pytest -q

  postgres:
    name: Integration · PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchgraph
          POSTGRES_PASSWORD: researchgraph
          POSTGRES_DB: researchgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchgraph"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://researchgraph:researchgraph@localhost:5432/researchgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]"
      - name: Postgres integration tests
        run: pytest -q -m postgres

  demo-and-eval:
    name: Demo + evaluation smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Demo (all failure scenarios)
        run: python -m scripts.demo --simulate-failures all --latency-ms 0 --no-color
      - name: Evaluation (demo mode, deterministic metrics + mock judge)
        run: python -m evaluation.run --judge
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/*.md

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t researchgraph-backend .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t researchgraph-frontend .
