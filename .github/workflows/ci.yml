name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Ruff (lint)
        run: ruff check backend scripts evaluation
      - name: Ruff (format)
        run: ruff format --check backend scripts evaluation
      - name: Mypy
        run: mypy
      - name: Tests (offline, mocked LLM & search)
        run: pytest -q

  postgres:
    name: Integration · PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchgraph
          POSTGRES_PASSWORD: researchgraph
          POSTGRES_DB: researchgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchgraph"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://researchgraph:researchgraph@localhost:5432/researchgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]"
      - name: Postgres integration tests
        run: pytest -q -m postgres

  demo-and-eval:
    name: Demo + evaluation smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Demo (all failure scenarios)
        run: python -m scripts.demo --simulate-failures all --latency-ms 0 --no-color
      - name: Evaluation (demo mode, deterministic metrics + mock judge)
        run: python -m evaluation.run --judge
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/*.md

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t researchgraph-backend .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t researchgraph-frontend .

  compose:
    name: Docker Compose · full stack smoke run
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, API and dashboard
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run a research question through the dashboard's /api proxy
        run: |
          body='{"question": "Compare RAG, fine-tuning and long-context prompting for domain-specific QA", "auto_approve": true}'
          id=$(curl -sf -X POST localhost:8080/api/research -H 'Content-Type: application/json' -d "$body" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for _ in $(seq 1 60); do
            status=$(curl -sf "localhost:8080/api/research/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "$id: $status"
            case "$status" in
              completed) curl -sf "localhost:8080/api/research/$id/report?format=markdown" | head -20; exit 0 ;;
              failed|cancelled|rejected) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
