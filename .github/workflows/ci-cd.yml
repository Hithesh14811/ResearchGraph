name: CI/CD

# Every push and pull request runs the full CI suite. On main, a green build publishes the
# Docker images to GHCR, deploys that exact commit to Render, waits for both services to
# report it, and smoke-tests production. Version tags (v1.2.3) publish versioned images.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Superseded PR builds are cancelled; main and tag builds always finish so a deploy is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  API_URL: https://researchgraph-api-n4ij.onrender.com
  DASHBOARD_URL: https://researchgraph-z8r1.onrender.com

jobs:
  # ------------------------------------------------------------------------------------------
  # CI
  # ------------------------------------------------------------------------------------------
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[all,dev]"
      - name: Ruff (lint)
        run: ruff check backend scripts evaluation
      - name: Ruff (format)
        run: ruff format --check backend scripts evaluation
      - name: Mypy
        run: mypy
      - name: Tests (offline, mocked LLM & search)
        run: pytest -q

  postgres:
    name: Integration · PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchgraph
          POSTGRES_PASSWORD: researchgraph
          POSTGRES_DB: researchgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchgraph"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://researchgraph:researchgraph@localhost:5432/researchgraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]"
      - name: Postgres integration tests
        run: pytest -q -m postgres

  demo-and-eval:
    name: Demo + evaluation smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Demo (all failure scenarios)
        run: python -m scripts.demo --simulate-failures all --latency-ms 0 --no-color
      - name: Evaluation (demo mode, deterministic metrics + mock judge)
        run: python -m evaluation.run --judge
      - uses: actions/upload-artifact@v6
        with:
          name: evaluation-results
          path: evaluation/results/*.md

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (strict TypeScript + Vite)
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
      - name: Build is stamped with its commit
        run: grep -q "<meta name=\"revision\" content=\"${GITHUB_SHA}\"" dist/index.html

  images:
    name: Docker · build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/backend.Dockerfile
          - image: dashboard
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: researchgraph-${{ matrix.image }}:ci
          load: ${{ matrix.image == 'api' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: API container starts and reports its commit
        if: matrix.image == 'api'
        run: |
          docker run -d --name api -p 8000:8000 researchgraph-api:ci
          for _ in $(seq 1 30); do
            if health=$(curl -fsS http://localhost:8000/health); then
              echo "$health" | jq .
              test "$(jq -r .commit <<<"$health")" = "$GITHUB_SHA"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  compose:
    name: Docker Compose · full stack smoke run
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres, API and dashboard
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Run a research question through the dashboard's /api proxy
        run: |
          body='{"question": "Compare RAG, fine-tuning and long-context prompting for domain-specific QA", "auto_approve": true}'
          id=$(curl -sf -X POST localhost:8080/api/research -H 'Content-Type: application/json' -d "$body" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          for _ in $(seq 1 60); do
            status=$(curl -sf "localhost:8080/api/research/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "$id: $status"
            case "$status" in
              completed) curl -sf "localhost:8080/api/research/$id/report?format=markdown" | head -20; exit 0 ;;
              failed|cancelled|rejected) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------------------------------
  # CD: only after every CI job above has passed
  # ------------------------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.image }} image to GHCR
    runs-on: ubuntu-latest
    needs: [backend, postgres, demo-and-eval, frontend, images, compose]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/backend.Dockerfile
            title: ResearchGraph API
          - image: dashboard
            dockerfile: docker/frontend.Dockerfile
            title: ResearchGraph dashboard
    steps:
      - uses: actions/checkout@v5
      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/researchgraph-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.title }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production (Render)
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 40
    environment:
      name: production
      url: https://researchgraph-z8r1.onrender.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      DASHBOARD_DEPLOY_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
    steps:
      # Deploy hooks pin the deploy to this commit, so production only ever runs code that
      # passed CI. Without them, Render's own auto-deploy ships the commit and this job
      # still verifies the rollout below.
      - name: Trigger API deploy
        if: env.API_DEPLOY_HOOK != ''
        run: |
          curl -fsS -X POST "${API_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null -w "API deploy hook: HTTP %{http_code}\n"
      - name: Trigger dashboard deploy
        if: env.DASHBOARD_DEPLOY_HOOK != ''
        run: |
          curl -fsS -X POST "${DASHBOARD_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null -w "Dashboard deploy hook: HTTP %{http_code}\n"
      - name: No deploy hooks configured
        if: env.API_DEPLOY_HOOK == '' || env.DASHBOARD_DEPLOY_HOOK == ''
        run: |
          echo "::notice title=Deploy::Deploy hook secret(s) not set; relying on Render auto-deploy and verifying the rollout."

      - name: Wait for the API to serve this commit
        run: |
          for attempt in $(seq 1 75); do  # 75 x 20 s = 25 min (free-tier builds and cold starts are slow)
            live=$(curl -fsS -m 60 "$API_URL/health" | jq -r '.commit // empty') || live=""
            if [[ -n "$live" && "$GITHUB_SHA" == "$live"* ]]; then
              echo "API is serving ${GITHUB_SHA::7}"
              exit 0
            fi
            echo "[$attempt] API reports ${live:-an unstamped build}; waiting for ${GITHUB_SHA::7}"
            sleep 20
          done
          echo "::error title=Deploy::The API did not start serving ${GITHUB_SHA::7} within 25 minutes"
          exit 1

      - name: Wait for the dashboard to serve this commit
        run: |
          for attempt in $(seq 1 45); do  # 45 x 20 s = 15 min
            # A unique query string skips the CDN's cached copy of index.html.
            live=$(curl -fsS -m 60 "$DASHBOARD_URL/?deploy-check=${GITHUB_RUN_ID}-${attempt}" \
              | sed -n 's/.*<meta name="revision" content="\([0-9a-f]*\)".*/\1/p') || live=""
            if [[ -n "$live" && "$GITHUB_SHA" == "$live"* ]]; then
              echo "Dashboard is serving ${GITHUB_SHA::7}"
              exit 0
            fi
            echo "[$attempt] Dashboard reports ${live:-an unstamped build}; waiting for ${GITHUB_SHA::7}"
            sleep 20
          done
          echo "::error title=Deploy::The dashboard did not start serving ${GITHUB_SHA::7} within 15 minutes"
          exit 1

      - name: Smoke-test production
        run: |
          health=$(curl -fsS -m 60 "$API_URL/health")
          jq . <<<"$health"
          test "$(jq -r .status <<<"$health")" = ok
          curl -fsS -m 60 -o /dev/null "$API_URL/research"
          curl -fsS -m 60 -o /dev/null "$API_URL/graph"
          curl -fsS -m 60 "$DASHBOARD_URL/" | grep -q '<div id="root">'
          echo "Production smoke test passed"

      - name: Summary
        run: |
          {
            echo "### Deployed ${GITHUB_SHA::7} to production"
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Dashboard | $DASHBOARD_URL |"
            echo "| API | $API_URL/docs |"
          } >> "$GITHUB_STEP_SUMMARY"
